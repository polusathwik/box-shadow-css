<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon</title>

    <style>
        .parent{
            background-color: black;
            height: 400px;
            width: 300px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .child{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 200px;
            box-shadow: 0 0 30px white;
        }
    </style>
</head>

<body>

<div class="parent">
    <div class="child">Moon</div>
</div>

<div class="moon1">Moon</div>

</body>
</html>
